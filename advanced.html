<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Advanced Data Cloud TCO Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #0176D3;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
    }
    .source-block {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
      position: relative;
    }
    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e74c3c;
      color: white;
      border: none;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      background-color: #0176D3;
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .results {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #0176D3;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Advanced Data Cloud TCO Calculator</h1>

  <div id="sourceContainer"></div>

  <button onclick="addSource()">+ Add Data Source</button>

  <label>Credit Rate (USD):</label>
  <input type="number" id="creditRate" value="2.50" step="0.01" oninput="calculateAdvanced()" />

  <div id="results" class="results" style="display:none;">
    <h3>Estimated Monthly & Annual Cost</h3>
    <div id="sourceBreakdown"></div>
    <p><strong>Total Monthly Credits:</strong> <span id="totalCredits"></span></p>
    <p><strong>Total Monthly Cost:</strong> $<span id="totalCost"></span></p>
    <p><strong>Annual Cost:</strong> $<span id="annualCost"></span></p>
  </div>

  <div class="back-link">
    <a href="index.html">&larr; Back to Simple Calculator</a>
  </div>

  <script src="assets/scripts/data-sources.js"></script>
  <script>
    let sourceCount = 0;

    function addSource(defaultConnector = "Salesforce CRM") {
      const container = document.getElementById("sourceContainer");
      const block = document.createElement("div");
      block.className = "source-block";
      block.setAttribute("id", `source-${sourceCount}`);

      const connectorOptions = Object.keys(connectorIngestionOptions)
        .map(conn => `<option value="${conn}" ${conn === defaultConnector ? 'selected' : ''}>${conn}</option>`)
        .join("");

      block.innerHTML = `
        <button class="remove-btn" onclick="removeSource(${sourceCount})">✕</button>
        <label>Connector:</label>
        <select id="connector-${sourceCount}" onchange="updateIngestionOptions(${sourceCount}); calculateAdvanced()">
          ${connectorOptions}
        </select>

        <label>Ingestion Method:</label>
        <select id="method-${sourceCount}" onchange="calculateAdvanced()"></select>

        <label>Monthly Volume (in millions of rows):</label>
        <input type="number" id="volume-${sourceCount}" value="1" min="0" step="0.1" oninput="calculateAdvanced()" />
      `;

      container.appendChild(block);
      updateIngestionOptions(sourceCount);
      sourceCount++;
      calculateAdvanced();
    }

    function removeSource(index) {
      const block = document.getElementById(`source-${index}`);
      block.remove();
      calculateAdvanced();
    }

    function updateIngestionOptions(index) {
      const connector = document.getElementById(`connector-${index}`).value;
      const methodDropdown = document.getElementById(`method-${index}`);
      const methods = connectorIngestionOptions[connector] || ["Batch"];
      methodDropdown.innerHTML = methods.map(m =>
        `<option value="${m}">${m}</option>`).join("");
      methodDropdown.disabled = methods.length === 1;
    }

    function calculateAdvanced() {
      const rate = parseFloat(document.getElementById("creditRate").value);
      const container = document.getElementById("sourceContainer");
      const blocks = container.querySelectorAll(".source-block");

      let totalCredits = 0;
      let breakdownHTML = "";

      blocks.forEach((block, i) => {
        const id = block.id.split("-")[1];
        const connector = document.getElementById(`connector-${id}`).value;
        const method = document.getElementById(`method-${id}`).value;
        const volume = parseFloat(document.getElementById(`volume-${id}`).value) || 0;
        const multiplier = creditMultipliers[method] || 2000;
        const credits = Math.round(multiplier * volume);
        totalCredits += credits;

        breakdownHTML += `
          <p><strong>Source ${parseInt(id) + 1}</strong><br/>
          Connector: ${connector}<br/>
          Method: ${method}<br/>
          Volume: ${volume}M<br/>
          Estimated Credits: ${credits}</p>
        `;
      });

      document.getElementById("sourceBreakdown").innerHTML = breakdownHTML;
      document.getElementById("totalCredits").textContent = totalCredits;
      document.getElementById("totalCost").textContent = (totalCredits * rate).toFixed(2);
      document.getElementById("annualCost").textContent = (totalCredits * rate * 12).toFixed(2);
      document.getElementById("results").style.display = blocks.length > 0 ? "block" : "none";
    }

    // Load with one default row
    window.onload = () => addSource();
  </script>
</body>
</html>
