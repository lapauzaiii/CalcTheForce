<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Advanced Data Cloud TCO Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #0176D3;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
    }
    .source-block {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .results {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #0176D3;
      color: white;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Advanced Data Cloud TCO Calculator</h1>

  <label>Number of Data Sources: <span id="sourceCountLabel">1</span></label>
  <input type="range" id="sourceCount" min="1" max="50" value="1" oninput="generateSources(this.value)" />

  <div id="sourceContainer"></div>

  <label>Credit Rate (USD):</label>
  <input type="number" id="creditRate" value="2.50" step="0.01" />

  <button onclick="calculateAdvanced()">Calculate</button>

  <div id="results" class="results" style="display:none;">
    <h3>Estimated Cost</h3>
    <div id="breakdown"></div>
    <p><strong>Total Monthly Credits:</strong> <span id="totalCredits"></span></p>
    <p><strong>Total Monthly Cost:</strong> $<span id="totalCost"></span></p>
    <p><strong>Annual Cost:</strong> $<span id="annualCost"></span></p>
  </div>

  <script src="assets/scripts/data-sources.js"></script>
  <script>
    function generateSources(count) {
      const container = document.getElementById("sourceContainer");
      document.getElementById("sourceCountLabel").textContent = count;
      container.innerHTML = "";

      for (let i = 0; i < count; i++) {
        const block = document.createElement("div");
        block.className = "source-block";

        const connectorOptions = Object.keys(connectorIngestionOptions)
          .map(conn => `<option value="${conn}">${conn}</option>`)
          .join("");

        block.innerHTML = `
          <label>Source ${i + 1} - Connector:</label>
          <select id="connector-${i}" onchange="updateIngestionOptions(${i})">
            ${connectorOptions}
          </select>
          <label>Ingestion Method:</label>
          <select id="method-${i}"></select>
          <label>Monthly Volume (in millions of rows):</label>
          <input type="number" id="volume-${i}" value="1" min="0" step="0.1" />
        `;

        container.appendChild(block);
        updateIngestionOptions(i);
      }
    }

    function updateIngestionOptions(index) {
      const conn = document.getElementById(`connector-${index}`).value;
      const methodDropdown = document.getElementById(`method-${index}`);
      const methods = connectorIngestionOptions[conn] || ["Batch"];

      methodDropdown.innerHTML = methods.map(m =>
        `<option value="${m}">${m}</option>`).join("");
      methodDropdown.disabled = methods.length === 1;
    }

    function calculateAdvanced() {
      const count = parseInt(document.getElementById("sourceCount").value);
      const rate = parseFloat(document.getElementById("creditRate").value);
      let totalCredits = 0;
      let breakdownHTML = "";

      for (let i = 0; i < count; i++) {
        const conn = document.getElementById(`connector-${i}`).value;
        const method = document.getElementById(`method-${i}`).value;
        const vol = parseFloat(document.getElementById(`volume-${i}`).value);
        const multiplier = creditMultipliers[method] || 2000;
        const credits = Math.round(multiplier * vol);
        totalCredits += credits;

        breakdownHTML += `
          <p><strong>Source ${i + 1}</strong><br/>
          Connector: ${conn}<br/>
          Method: ${method}<br/>
          Volume: ${vol}M<br/>
          Estimated Credits: ${credits}</p>
        `;
      }

      document.getElementById("breakdown").innerHTML = breakdownHTML;
      document.getElementById("totalCredits").textContent = totalCredits;
      document.getElementById("totalCost").textContent = (totalCredits * rate).toFixed(2);
      document.getElementById("annualCost").textContent = (totalCredits * rate * 12).toFixed(2);
      document.getElementById("results").style.display = "block";
    }

    generateSources(1);
  </script>
</body>
</html>
