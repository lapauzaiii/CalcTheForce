<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Cloud TCO Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
      color: #0176D3;
    }
    .toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .toggle button {
      margin: 0 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .section { display: none; }
    label {
      margin-top: 10px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px;
    }
    .source {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
    }
    .results {
      margin-top: 20px;
      background-color: #f2f2f2;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Salesforce Data Cloud TCO Calculator</h1>

  <div class="toggle">
    <button onclick="showMode('simple')">Simple</button>
    <button onclick="showMode('advanced')">Advanced</button>
  </div>

  <!-- SIMPLE MODE -->
  <div id="simple" class="section">
    <h2>Simple Mode</h2>
    <!-- Reuse the simple calculator UI here -->
    <p>This is your existing simple calculator section.</p>
  </div>

  <!-- ADVANCED MODE -->
  <div id="advanced" class="section">
    <h2>Advanced Mode</h2>
    <div id="sourceList"></div>
    <button onclick="addSource()">+ Add Data Source</button>

    <label for="creditRate">Credit Rate (USD per credit):</label>
    <input type="number" id="creditRate" value="2.50" step="0.01" />

    <button onclick="calculateAdvanced()">Calculate TCO</button>

    <div class="results" id="advancedResults" style="display:none;">
      <h3>Estimated Advanced Cost</h3>
      <div id="breakdown"></div>
      <p><strong>Total Credits:</strong> <span id="totalCredits"></span></p>
      <p><strong>Total Monthly Cost:</strong> $<span id="totalCost"></span></p>
    </div>
  </div>

  <script>
    const connectors = {
      "Salesforce CRM (Batch)": 2000,
      "MuleSoft (Batch)": 2000,
      "MuleSoft (Streaming)": 5000,
      "Adobe / Marketo (Batch)": 2000,
      "Mobile SDK (Real-time Events)": 70000
    };

    function showMode(mode) {
      document.querySelectorAll('.section').forEach(el => el.style.display = 'none');
      document.getElementById(mode).style.display = 'block';
    }

    let sourceIndex = 0;

    function addSource() {
      const container = document.createElement('div');
      container.classList.add('source');
      container.setAttribute('id', `source-${sourceIndex}`);
      container.innerHTML = `
        <label>Data Source Name:</label>
        <input type="text" id="name-${sourceIndex}" placeholder="e.g. Salesforce CRM">

        <label>Connector Type:</label>
        <select id="connector-${sourceIndex}">
          ${Object.keys(connectors).map(c => `<option value="${c}">${c}</option>`).join("")}
        </select>

        <label>Monthly Volume (in millions of rows):</label>
        <input type="number" id="volume-${sourceIndex}" value="1" min="0" step="0.01">
      `;
      document.getElementById("sourceList").appendChild(container);
      sourceIndex++;
    }

    function calculateAdvanced() {
      let totalCredits = 0;
      let breakdownHTML = "";
      const creditRate = parseFloat(document.getElementById("creditRate").value);

      for (let i = 0; i < sourceIndex; i++) {
        const name = document.getElementById(`name-${i}`)?.value || `Source ${i + 1}`;
        const connector = document.getElementById(`connector-${i}`)?.value;
        const volume = parseFloat(document.getElementById(`volume-${i}`)?.value || 0);
        if (!connector || !volume) continue;

        const multiplier = connectors[connector];
        const credits = Math.round(multiplier * volume);
        totalCredits += credits;

        breakdownHTML += `
          <p><strong>${name}</strong><br/>
          Connector: ${connector}<br/>
          Volume: ${volume}M rows<br/>
          Estimated Credits: ${credits}</p>
        `;
      }

      const totalCost = (totalCredits * creditRate).toFixed(2);

      document.getElementById("breakdown").innerHTML = breakdownHTML;
      document.getElementById("totalCredits").textContent = totalCredits;
      document.getElementById("totalCost").textContent = totalCost;
      document.getElementById("advancedResults").style.display = "block";
    }

    // Load simple mode by default
    showMode('simple');
  </script>
</body>
</html>
