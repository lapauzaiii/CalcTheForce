<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salesforce Data Cloud TCO Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    h1 {
      text-align: center;
      color: #0176D3;
    }
    label {
      display: block;
      margin-top: 20px;
    }
    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 30px;
      background-color: #0176D3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
    }
    .results {
      margin-top: 30px;
      padding: 15px;
      background-color: #f2f2f2;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Data Cloud TCO Calculator</h1>

  <label for="dataVolume">1. Monthly Data Volume:</label>
  <select id="dataVolume">
    <option value="250">Fewer than 1M records</option>
    <option value="500">1M–10M records</option>
    <option value="1000">10M–50M records</option>
    <option value="2000">More than 50M records</option>
  </select>

  <label for="refreshRate">2. Refresh Frequency:</label>
  <select id="refreshRate">
    <option value="1">Monthly</option>
    <option value="1.5">Weekly</option>
    <option value="2">Daily</option>
    <option value="3">Real-time</option>
  </select>

  <label for="segments">3. Number of Segments or Insights:</label>
  <select id="segments">
    <option value="50">1–5</option>
    <option value="100">6–15</option>
    <option value="200">16–30</option>
    <option value="400">30+</option>
  </select>

  <label for="activation">4. Activation Frequency:</label>
  <select id="activation">
    <option value="100">1–2x/month</option>
    <option value="200">Weekly</option>
    <option value="400">Daily</option>
    <option value="0">Not using</option>
  </select>

  <label for="retention">5. Data Retention Period:</label>
  <select id="retention">
    <option value="100">3 months</option>
    <option value="200">6 months</option>
    <option value="300">12 months</option>
    <option value="400">18+ months</option>
  </select>

  <label for="creditRate">6. Credit Rate (USD per credit):</label>
  <input type="number" id="creditRate" value="2.50" step="0.01" />

  <button onclick="calculateTCO()">Calculate TCO</button>

  <div class="results" id="results" style="display:none;">
    <h2>Estimated Cost</h2>
    <p><strong>Monthly Credit Estimate:</strong> <span id="credits"></span> credits</p>
    <p><strong>Monthly Cost:</strong> $<span id="monthly"></span></p>
    <p><strong>Annual Cost:</strong> $<span id="annual"></span></p>
  </div>

  <script>
    function calculateTCO() {
      const dataVolume = parseInt(document.getElementById("dataVolume").value);
      const refreshRate = parseFloat(document.getElementById("refreshRate").value);
      const segments = parseInt(document.getElementById("segments").value);
      const activation = parseInt(document.getElementById("activation").value);
      const retention = parseInt(document.getElementById("retention").value);
      const creditRate = parseFloat(document.getElementById("creditRate").value);

      // Base calculation
      const creditEstimate = Math.round(
        (dataVolume * refreshRate) + segments + activation + (retention / 3)
      );

      const monthlyCost = (creditEstimate * creditRate).toFixed(2);
      const annualCost = (creditEstimate * creditRate * 12).toFixed(2);

      document.getElementById("credits").textContent = creditEstimate;
      document.getElementById("monthly").textContent = monthlyCost;
      document.getElementById("annual").textContent = annualCost;
      document.getElementById("results").style.display = "block";
    }
  </script>
</body>
</html>
